<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KHARAL MODS - All-in-One PRO</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #08091a, #12142e);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 30px 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f7dc6f, #f1c40f, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        header p {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .status-bar {
            background: rgba(46, 204, 113, 0.08);
            border: 1px solid rgba(46, 204, 113, 0.15);
            border-radius: 30px;
            padding: 10px 20px;
            margin-bottom: 20px;
            text-align: center;
            color: #2ecc71;
            font-size: 0.8rem;
        }

        .status-bar .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ecc71;
            margin-right: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            justify-content: center;
        }

        .tabs button {
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            flex: 1;
            min-width: 100px;
        }

        .tabs button.active {
            background: rgba(241, 196, 15, 0.12);
            color: #f7dc6f;
            border-color: rgba(241, 196, 15, 0.2);
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.05);
        }

        .tabs button:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-box {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 14px 22px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .search-box button {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #f7dc6f, #f39c12);
            color: #0a0b1e;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.25);
        }

        .search-box button:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(243, 156, 18, 0.4);
        }

        #resultArea {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            padding: 18px;
            min-height: 100px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 18px;
        }

        .result-card {
            color: #fff;
        }

        .result-card .record {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 3px solid #f1c40f;
        }

        .result-card .record p {
            margin: 3px 0;
            font-size: 0.9rem;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .result-card .record strong {
            color: #f7dc6f;
            min-width: 70px;
        }

        .result-card .record .value {
            color: rgba(255, 255, 255, 0.8);
            word-break: break-word;
        }

        .badge {
            display: inline-block;
            background: rgba(241, 196, 15, 0.1);
            color: #f7dc6f;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid rgba(241, 196, 15, 0.1);
            margin-bottom: 12px;
        }

        .action-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-bar button {
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.06);
            flex: 1;
            min-width: 100px;
        }

        .action-bar button:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
        }

        .action-bar #saveBtn { background: rgba(46, 204, 113, 0.12); border-color: rgba(46,204,113,0.2); color: #2ecc71; }
        .action-bar #imageBtn { background: rgba(52, 152, 219, 0.12); border-color: rgba(52,152,219,0.2); color: #3498db; }
        .action-bar #verifyBtn { background: rgba(231, 76, 60, 0.12); border-color: rgba(231,76,60,0.2); color: #e74c3c; }

        .verification-box {
            margin-top: 15px;
            padding: 14px 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .verification-box.show { display: block; }
        .verification-box.success { border-color: rgba(46,204,113,0.3); color: #2ecc71; }
        .verification-box.fail { border-color: rgba(231,76,60,0.3); color: #e74c3c; }

        .loader {
            display: none;
            text-align: center;
            padding: 25px;
            color: rgba(255, 255, 255, 0.2);
        }

        .loader.show { display: block; }
        .loader span {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f7dc6f;
            margin: 0 4px;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .loader span:nth-child(2) { animation-delay: 0.2s; }
        .loader span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.65rem;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .container { padding: 18px 12px; }
            header h1 { font-size: 2rem; }
            .search-box { flex-direction: column; background: transparent; padding: 0; gap: 8px; }
            .search-box input { background: rgba(255,255,255,0.04); border-radius: 40px; }
            .search-box button { width: 100%; }
            .tabs button { font-size: 0.7rem; padding: 8px 12px; min-width: 70px; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <header>
        <h1>⚡ KHARAL MODS</h1>
        <p>CNIC • VEHICLE • SIM • NADRA</p>
    </header>

    <div class="status-bar">
        <span class="dot"></span> Proxy Server Active • All APIs Working
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="active" data-tab="tabCNIC">🪪 CNIC</button>
        <button data-tab="tabVehicle">🚗 Vehicle</button>
        <button data-tab="tabSIM">📱 SIM</button>
        <button data-tab="tabIndian">🇮🇳 Indian</button>
    </div>

    <!-- ===== TAB 1: CNIC ===== -->
    <div id="tabCNIC" class="tab-content active">
        <div class="search-box">
            <input type="text" id="cnicInput" placeholder="Enter 13-digit CNIC (e.g. 4250150162961)" maxlength="13" />
            <button id="cnicBtn">🔍 Search</button>
        </div>
        <div id="resultArea"><div id="resultContent"><p style="color:rgba(255,255,255,0.15);padding:25px;text-align:center;">Enter CNIC to fetch Name & Address</p></div></div>
        <div class="action-bar" id="actionBarCNIC" style="display:none;">
            <button id="saveBtnCNIC">💾 Save JSON</button>
            <button id="imageBtnCNIC">📸 Save Image</button>
            <button id="verifyBtnCNIC">✅ NADRA Verify</button>
        </div>
        <div class="verification-box" id="verificationCNIC"></div>
    </div>

    <!-- ===== TAB 2: VEHICLE ===== -->
    <div id="tabVehicle" class="tab-content">
        <div class="search-box">
            <input type="text" id="vehicleInput" placeholder="Enter Registration No (e.g. ABC-123)" />
            <button id="vehicleBtn">🔍 Search</button>
        </div>
        <div id="resultAreaVehicle"><div id="resultContentVehicle"><p style="color:rgba(255,255,255,0.15);padding:25px;text-align:center;">Enter vehicle number to search</p></div></div>
        <div class="action-bar" id="actionBarVehicle" style="display:none;">
            <button id="saveBtnVehicle">💾 Save JSON</button>
            <button id="imageBtnVehicle">📸 Save Image</button>
        </div>
        <div class="verification-box" id="verificationVehicle"></div>
    </div>

    <!-- ===== TAB 3: SIM ===== -->
    <div id="tabSIM" class="tab-content">
        <div class="search-box">
            <input type="text" id="simInput" placeholder="Enter 11-digit mobile number" maxlength="11" />
            <button id="simBtn">🔍 Search</button>
        </div>
        <div id="resultAreaSIM"><div id="resultContentSIM"><p style="color:rgba(255,255,255,0.15);padding:25px;text-align:center;">Enter mobile number for SIM details</p></div></div>
        <div class="action-bar" id="actionBarSIM" style="display:none;">
            <button id="saveBtnSIM">💾 Save JSON</button>
            <button id="imageBtnSIM">📸 Save Image</button>
            <button id="verifyBtnSIM">✅ NADRA Verify</button>
        </div>
        <div class="verification-box" id="verificationSIM"></div>
    </div>

    <!-- ===== TAB 4: INDIAN ===== -->
    <div id="tabIndian" class="tab-content">
        <div class="search-box">
            <input type="text" id="indianInput" placeholder="Enter 10-digit Indian number" maxlength="10" />
            <button id="indianBtn">🔍 Search</button>
        </div>
        <div id="resultAreaIndian"><div id="resultContentIndian"><p style="color:rgba(255,255,255,0.15);padding:25px;text-align:center;">Enter Indian mobile number</p></div></div>
        <div class="action-bar" id="actionBarIndian" style="display:none;">
            <button id="saveBtnIndian">💾 Save JSON</button>
            <button id="imageBtnIndian">📸 Save Image</button>
        </div>
        <div class="verification-box" id="verificationIndian"></div>
    </div>

    <div class="footer">KHARAL MODS • ALL-IN-ONE PREMIUM TOOL</div>
</div>

<script>
    // ===== API BASE (Proxy Server) =====
    const API_BASE = 'http://localhost:3000/api';

    // ===== UTILITY FUNCTIONS =====
    function showLoader(areaId) {
        document.getElementById(areaId).innerHTML = `
            <div class="loader show">
                <span></span><span></span><span></span>
                <p style="margin-top:10px;color:rgba(255,255,255,0.3);">Loading...</p>
            </div>
        `;
    }

    function displayResult(areaId, data, fields) {
        let html = `<div class="result-card">`;
        if (data.count !== undefined) {
            html += `<div class="badge">📋 ${data.count} record${data.count > 1 ? 's' : ''} found</div>`;
        }
        const items = Array.isArray(data) ? data : [data];
        items.forEach(item => {
            html += `<div class="record">`;
            fields.forEach(f => {
                const val = item[f.key] !== undefined && item[f.key] !== null ? item[f.key] : 'N/A';
                html += `<p><strong>${f.label}:</strong> <span class="value">${val}</span></p>`;
            });
            html += `</div>`;
        });
        html += `</div>`;
        document.getElementById(areaId).innerHTML = html;
    }

    function showError(areaId, msg) {
        document.getElementById(areaId).innerHTML = `<p style="color:#e74c3c;padding:20px;text-align:center;">⚠️ ${msg}</p>`;
    }

    // Tab switching
    document.querySelectorAll('.tabs button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(this.dataset.tab).classList.add('active');
        });
    });

    // ===== 1. CNIC API =====
    document.getElementById('cnicBtn').addEventListener('click', async function() {
        const cnic = document.getElementById('cnicInput').value.trim();
        if (cnic.length !== 13) { showError('resultContent', 'Enter valid 13-digit CNIC'); return; }
        showLoader('resultContent');
        try {
            const res = await fetch(`${API_BASE}/cnic/${cnic}`);
            const data = await res.json();
            if (data && data.length > 0) {
                displayResult('resultContent', data, [
                    { key: 'IDENTIFICATION_NO', label: '🆔 CNIC' },
                    { key: 'NAME', label: '👤 Name' },
                    { key: 'PRESENT_ADDRESS', label: '📍 Present Address' },
                    { key: 'PERMANANT_ADDRESS', label: '🏠 Permanent Address' }
                ]);
                document.getElementById('actionBarCNIC').style.display = 'flex';
                window._cnicData = data;
            } else {
                showError('resultContent', 'No record found');
                document.getElementById('actionBarCNIC').style.display = 'none';
            }
        } catch (e) {
            showError('resultContent', 'Network error. Make sure proxy server is running on port 3000');
        }
    });

    // ===== 2. VEHICLE API =====
    document.getElementById('vehicleBtn').addEventListener('click', async function() {
        const reg = document.getElementById('vehicleInput').value.trim();
        if (!reg) { showError('resultContentVehicle', 'Enter registration number'); return; }
        showLoader('resultContentVehicle');
        try {
            const res = await fetch(`${API_BASE}/vehicle/${encodeURIComponent(reg)}`);
            const data = await res.json();
            if (data && data.total > 0) {
                const allRecords = [];
                for (const key in data.sources) {
                    if (Array.isArray(data.sources[key])) {
                        data.sources[key].forEach(r => allRecords.push(r));
                    }
                }
                if (allRecords.length > 0) {
                    displayResult('resultContentVehicle', allRecords, [
                        { key: 'veh_reg_no', label: '🚗 Reg No' },
                        { key: 'own_name', label: '👤 Owner' },
                        { key: 'f_h_name', label: '👨 Father/Husband' },
                        { key: 'make_maker', label: '🏭 Make' },
                        { key: 'reg_date', label: '📅 Reg Date' },
                        { key: 'source_city', label: '📍 Source' }
                    ]);
                    document.getElementById('actionBarVehicle').style.display = 'flex';
                    window._vehicleData = data;
                } else {
                    showError('resultContentVehicle', 'No vehicle records found');
                    document.getElementById('actionBarVehicle').style.display = 'none';
                }
            } else {
                showError('resultContentVehicle', 'No results');
                document.getElementById('actionBarVehicle').style.display = 'none';
            }
        } catch (e) {
            showError('resultContentVehicle', 'Network error. Make sure proxy server is running on port 3000');
        }
    });

    // ===== 3. SIM API =====
    document.getElementById('simBtn').addEventListener('click', async function() {
        const num = document.getElementById('simInput').value.trim();
        if (num.length !== 11) { showError('resultContentSIM', 'Enter 11-digit number'); return; }
        showLoader('resultContentSIM');
        try {
            const res = await fetch(`${API_BASE}/sim/${num}`);
            const data = await res.json();
            if (data && data.success && data.records && data.records.length > 0) {
                displayResult('resultContentSIM', data.records, [
                    { key: 'name', label: '👤 Name' },
                    { key: 'mobile', label: '📱 Mobile' },
                    { key: 'cnic', label: '🆔 CNIC' },
                    { key: 'address', label: '📍 Address' },
                    { key: 'network', label: '📶 Network' }
                ]);
                document.getElementById('actionBarSIM').style.display = 'flex';
                window._simData = data;
            } else {
                showError('resultContentSIM', 'No SIM records found');
                document.getElementById('actionBarSIM').style.display = 'none';
            }
        } catch (e) {
            showError('resultContentSIM', 'Network error. Make sure proxy server is running on port 3000');
        }
    });

    // ===== 4. INDIAN API =====
    document.getElementById('indianBtn').addEventListener('click', async function() {
        const num = document.getElementById('indianInput').value.trim();
        if (num.length !== 10) { showError('resultContentIndian', 'Enter 10-digit Indian number'); return; }
        showLoader('resultContentIndian');
        try {
            const res = await fetch(`${API_BASE}/indian/${num}`);
            const data = await res.json();
            displayResult('resultContentIndian', [data], [
                { key: 'success', label: '✅ Success' },
                { key: 'message', label: '📝 Message' },
                { key: 'developer', label: '👨‍💻 Developer' },
                { key: 'telegram', label: '📢 Telegram' }
            ]);
            document.getElementById('actionBarIndian').style.display = 'flex';
            window._indianData = data;
        } catch (e) {
            showError('resultContentIndian', 'Network error. Make sure proxy server is running on port 3000');
        }
    });

    // ===== SAVE FUNCTIONS (JSON & IMAGE) =====
    function saveJSON(data, prefix) {
        if (!data) { alert('No data to save!'); return; }
        const jsonStr = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${prefix}_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function saveImage(elementId, prefix) {
        const el = document.getElementById(elementId);
        if (!el || !el.innerHTML || el.innerHTML.includes('No data') || el.innerHTML.includes('error')) {
            alert('No data to capture!');
            return;
        }
        html2canvas(el, { backgroundColor: '#0a0b1e', scale: 2, borderRadius: '30px' })
            .then(canvas => {
                const link = document.createElement('a');
                link.download = `${prefix}_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            })
            .catch(() => alert('Image capture failed'));
    }

    // CNIC buttons
    document.getElementById('saveBtnCNIC').addEventListener('click', () => saveJSON(window._cnicData, 'cnic'));
    document.getElementById('imageBtnCNIC').addEventListener('click', () => saveImage('resultContent', 'cnic_image'));

    // Vehicle buttons
    document.getElementById('saveBtnVehicle').addEventListener('click', () => saveJSON(window._vehicleData, 'vehicle'));
    document.getElementById('imageBtnVehicle').addEventListener('click', () => saveImage('resultContentVehicle', 'vehicle_image'));

    // SIM buttons
    document.getElementById('saveBtnSIM').addEventListener('click', () => saveJSON(window._simData, 'sim'));
    document.getElementById('imageBtnSIM').addEventListener('click', () => saveImage('resultContentSIM', 'sim_image'));

    // Indian buttons
    document.getElementById('saveBtnIndian').addEventListener('click', () => saveJSON(window._indianData, 'indian'));
    document.getElementById('imageBtnIndian').addEventListener('click', () => saveImage('resultContentIndian', 'indian_image'));

    // ===== NADRA VERIFICATION (MOCK) =====
    function verifyNADRA(data, verifyEl, btnEl) {
        if (!data) { alert('No data to verify!'); return; }
        verifyEl.style.display = 'block';
        verifyEl.className = 'verification-box show';
        verifyEl.innerHTML = '⏳ Verifying with NADRA...';
        setTimeout(() => {
            const first = Array.isArray(data) ? data[0] : data;
            const name = first?.name || first?.NAME || first?.own_name || '';
            const cnic = first?.cnic || first?.IDENTIFICATION_NO || first?.own_new_no || '';
            const isValid = (cnic && cnic.length >= 11) && (name && name.length > 2);
            if (isValid) {
                verifyEl.className = 'verification-box show success';
                verifyEl.innerHTML = `✅ <strong>NADRA Verified</strong><br>CNIC: ${cnic}<br>Name: ${name}<br>Status: <span style="color:#2ecc71;">✔ Authentic</span>`;
                if (btnEl) btnEl.style.background = 'rgba(46, 204, 113, 0.2)';
            } else {
                verifyEl.className = 'verification-box show fail';
                verifyEl.innerHTML = '❌ <strong>Verification Failed</strong><br>Could not verify with NADRA.';
                if (btnEl) btnEl.style.background = 'rgba(231, 76, 60, 0.2)';
            }
        }, 1500);
    }

    document.getElementById('verifyBtnCNIC').addEventListener('click', function() {
        verifyNADRA(window._cnicData, document.getElementById('verificationCNIC'), this);
    });
    document.getElementById('verifyBtnSIM').addEventListener('click', function() {
        verifyNADRA(window._simData?.records, document.getElementById('verificationSIM'), this);
    });

    // Enter key support
    document.querySelectorAll('.search-box input').forEach(inp => {
        inp.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const parent = inp.closest('.tab-content');
                const btn = parent.querySelector('.search-box button');
                if (btn) btn.click();
            }
        });
    });

    // Auto-format digits only for CNIC, SIM, Indian
    document.getElementById('cnicInput').addEventListener('input', function() { this.value = this.value.replace(/\D/g, ''); });
    document.getElementById('simInput').addEventListener('input', function() { this.value = this.value.replace(/\D/g, ''); });
    document.getElementById('indianInput').addEventListener('input', function() { this.value = this.value.replace(/\D/g, ''); });

    console.log('✅ KHARAL MODS PRO loaded successfully!');
    console.log('📌 Make sure proxy server is running on http://localhost:3000');
</script>

</body>
</html>
