<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHARAL MODS | Citizen Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: #ffffff;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #FFD96640; border-radius: 8px; }
        
        .glass-panel {
            backdrop-filter: blur(16px);
            background: rgba(30, 26, 13, 0.7);
            border: 1px solid rgba(255, 217, 102, 0.25);
        }
        .premium-border {
            box-shadow: 0 0 0 1px rgba(255, 217, 102, 0.2), 0 8px 30px rgba(0,0,0,0.3);
        }
        
        .result-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            color: #000000;
            padding: 20px;
            animation: fadeIn 0.3s ease-out;
        }
        .result-card .label { color: #6b7280; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .result-card .value { color: #000000; font-weight: 700; font-size: 16px; }
        
        .btn-yellow {
            background: #FFD966 !important;
            color: #000 !important;
            font-weight: 700;
            border: none;
        }
        .btn-yellow:hover {
            background: #FFE066 !important;
            transform: scale(1.02);
        }
        .btn-yellow:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        input, button, textarea { outline: none; }
        
        .coin-badge {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(12px);
            pointer-events: auto;
            animation: slideUp 0.3s ease-out;
        }
        .toast.success { background: rgba(34, 197, 94, 0.9); color: #fff; }
        .toast.error { background: rgba(220, 38, 38, 0.9); color: #fff; }
        .toast.info { background: rgba(59, 130, 246, 0.9); color: #fff; }
        .toast.notfound { background: rgba(255, 165, 0, 0.9); color: #fff; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .tab-btn-active {
            background: #FFD966 !important;
            color: #000 !important;
            box-shadow: 0 0 20px rgba(255,217,102,0.3);
        }
        .tab-btn-inactive {
            background: transparent !important;
            color: #a89870 !important;
        }
        .tab-btn-inactive:hover {
            background: rgba(255,217,102,0.1) !important;
            color: #FFD966 !important;
        }
        
        @media (max-width: 600px) {
            .result-card .value { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- ========== TOAST ========== -->
    <div id="toast-container"></div>

    <!-- ========== MAIN ========== -->
    <div id="save-area" class="max-w-3xl mx-auto px-4 py-6 w-full">
        
        <!-- HEADER -->
        <div class="flex flex-col items-center gap-4 mb-8 border-b border-chaudhary-500/30 pb-6">
            <div class="flex items-center gap-3">
                <div class="w-14 h-14 rounded-full bg-chaudhary-600/20 flex items-center justify-center border border-chaudhary-500 shadow-[0_0_30px_rgba(255,217,102,0.3)]">
                    <i class="bi bi-shield-lock-fill text-chaudhary-500 text-3xl"></i>
                </div>
                <h1 class="text-3xl md:text-4xl font-black tracking-tighter bg-gradient-to-r from-chaudhary-500 to-amber-400 bg-clip-text text-transparent">KHARAL MODS</h1>
            </div>
            <p class="text-amber-500/60 text-sm font-mono">⚡ OFFLINE CITIZEN DATABASE</p>
            <div class="flex items-center gap-4 text-xs text-amber-700">
                <span><i class="bi bi-database"></i> <span id="totalRecords">0</span> Records</span>
                <span><i class="bi bi-clock"></i> <span id="lastUpdated">Loading...</span></span>
            </div>
        </div>

        <!-- SEARCH SECTION -->
        <div class="glass-panel rounded-2xl p-6 md:p-8 premium-border relative overflow-hidden">
            <div class="absolute top-0 right-0 w-72 h-72 bg-chaudhary-500/5 rounded-full blur-3xl -mr-36 -mt-36 pointer-events-none"></div>
            
            <div class="flex justify-between items-center mb-4">
                <span class="text-amber-400/60 text-xs"><i class="bi bi-info-circle"></i> Offline Database</span>
                <span class="text-amber-400/60 text-xs"><i class="bi bi-search"></i> CNIC Search</span>
            </div>
            
            <form id="search-form" class="flex flex-col gap-5">
                <div class="relative">
                    <i class="bi bi-person-badge absolute left-4 top-1/2 -translate-y-1/2 text-chaudhary-500/70 text-xl"></i>
                    <input type="text" id="search-input" autocomplete="off" placeholder="Enter CNIC (e.g. 3022942606)" class="w-full bg-black/50 border border-chaudhary-500/40 text-amber-200 rounded-xl pl-12 pr-4 py-4 focus:ring-2 focus:ring-chaudhary-500 focus:border-transparent transition-all text-lg font-mono tracking-wider">
                </div>
                <button type="submit" id="searchBtn" class="btn-yellow w-full text-black font-extrabold text-lg py-4 rounded-xl shadow-[0_0_20px_rgba(255,217,102,0.4)] transform hover:scale-[1.01] transition-all flex justify-center items-center gap-2">
                    <i class="bi bi-search-heart"></i> <span>SEARCH CITIZEN</span>
                </button>
            </form>
        </div>

        <!-- RESULTS -->
        <div id="results-container" class="mt-6 hidden"></div>

        <!-- FOOTER -->
        <div class="text-center text-[10px] text-amber-800/50 mt-8 border-t border-chaudhary-500/10 pt-4">
            KHARAL MODS • OFFLINE CITIZEN DATABASE • <span id="footerRecords">0</span> RECORDS
        </div>
    </div>

    <!-- ========== MAIN.JS (CSV DATA) ========== -->
    <script src="main.js"></script>

    <script>
        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ============================================================
        //  UPDATE STATS
        // ============================================================
        function updateStats() {
            // Check if citizenDatabase exists (converted from CSV)
            if (typeof citizenDatabase !== 'undefined' && Array.isArray(citizenDatabase)) {
                document.getElementById('totalRecords').textContent = citizenDatabase.length;
                document.getElementById('footerRecords').textContent = citizenDatabase.length;
                document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
                console.log('✅ Database loaded:', citizenDatabase.length, 'records');
            } else {
                console.warn('⚠️ Database not loaded yet');
                setTimeout(updateStats, 500);
            }
        }

        // ============================================================
        //  SEARCH FUNCTION
        // ============================================================
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const input = document.getElementById('search-input');
            const query = input.value.trim().replace(/[^0-9]/g, '');
            
            if (!query || query.length < 10) {
                showToast('Please enter a valid CNIC (10-13 digits)', 'error');
                return;
            }

            const container = document.getElementById('results-container');
            const btn = document.getElementById('searchBtn');
            
            container.classList.remove('hidden');
            container.innerHTML = `
                <div class="flex flex-col items-center p-10 glass-panel rounded-2xl">
                    <div class="w-10 h-10 border-4 border-chaudhary-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-chaudhary-400 text-xs">SEARCHING DATABASE...</p>
                </div>
            `;
            
            btn.disabled = true;
            btn.classList.add('opacity-60');

            try {
                // Check if database is loaded
                if (typeof citizenDatabase === 'undefined' || !Array.isArray(citizenDatabase)) {
                    container.innerHTML = `
                        <div class="result-card text-center">
                            <i class="bi bi-database-exclamation text-4xl text-red-500 mb-2 block"></i>
                            <h3 class="font-bold text-red-500 text-sm">DATABASE NOT LOADED</h3>
                            <p class="text-gray-500 text-xs mt-1">Please check if main.js is properly linked</p>
                            <p class="text-gray-400 text-xs mt-2">Expected: citizenDatabase array with records</p>
                        </div>
                    `;
                    showToast('Database not loaded', 'error');
                    return;
                }

                if (citizenDatabase.length === 0) {
                    container.innerHTML = `
                        <div class="result-card text-center">
                            <i class="bi bi-database-exclamation text-4xl text-orange-500 mb-2 block"></i>
                            <h3 class="font-bold text-orange-500 text-sm">EMPTY DATABASE</h3>
                            <p class="text-gray-500 text-xs mt-1">No records found in database</p>
                        </div>
                    `;
                    showToast('Database is empty', 'notfound');
                    return;
                }

                // Search for the CNIC
                const result = citizenDatabase.find(record => {
                    const cnic = String(record.cnic || '').replace(/[^0-9]/g, '');
                    return cnic === query;
                });

                if (result) {
                    // Build result card
                    let html = `<div class="result-card">`;
                    html += `<div class="flex justify-between items-center border-b border-gray-200 pb-3 mb-3">
                                <span class="header-text text-lg font-bold">✅ CITIZEN FOUND</span>
                                <button onclick="copyResult()" class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded-lg text-sm font-bold">📋 COPY</button>
                            </div>`;
                    
                    const allFields = Object.keys(result);
                    allFields.forEach(key => {
                        const val = result[key];
                        if (val !== null && val !== undefined && val !== '' && val !== 'null' && val !== 'undefined') {
                            const label = key.replace(/_/g, ' ').toUpperCase();
                            const isUrdu = /[\u0600-\u06FF]/.test(String(val));
                            html += `<div class="flex justify-between py-2 border-b border-gray-50 last:border-0">
                                        <span class="label">${label}</span>
                                        <span class="value ${isUrdu ? 'text-right' : ''}">${String(val)}</span>
                                    </div>`;
                        }
                    });
                    html += `</div>`;
                    
                    container.innerHTML = html;
                    showToast('Citizen found!', 'success');
                    
                    // Store for copy
                    window.lastResult = JSON.stringify(result, null, 2);
                    
                } else {
                    container.innerHTML = `
                        <div class="result-card text-center">
                            <i class="bi bi-person-x text-6xl text-orange-400 mb-3 block"></i>
                            <h3 class="font-bold text-orange-500 text-lg">NOT FOUND</h3>
                            <p class="text-gray-500 text-sm mt-1">No citizen found with CNIC: <span class="font-mono font-bold">${query}</span></p>
                            <p class="text-gray-400 text-xs mt-2">Please check the number and try again</p>
                        </div>
                    `;
                    showToast('No citizen found', 'notfound');
                }

            } catch (err) {
                console.error('Search Error:', err);
                container.innerHTML = `
                    <div class="result-card text-center">
                        <i class="bi bi-exclamation-triangle-fill text-4xl text-red-500 mb-2 block"></i>
                        <h3 class="font-bold text-red-500 text-sm">ERROR</h3>
                        <p class="text-gray-500 text-xs mt-1">${err.message}</p>
                        <p class="text-gray-400 text-xs mt-2">Check console for details</p>
                    </div>
                `;
                showToast('Search error', 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-60');
            }
        });

        // ============================================================
        //  COPY RESULT
        // ============================================================
        function copyResult() {
            if (window.lastResult) {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(window.lastResult).then(() => {
                        showToast('Copied!', 'success');
                    }).catch(() => fallbackCopy(window.lastResult));
                } else {
                    fallbackCopy(window.lastResult);
                }
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); showToast('Copied!', 'success'); } catch(e) { showToast('Copy failed', 'error'); }
            ta.remove();
        }

        // ============================================================
        //  INIT
        // ============================================================
        // Wait for main.js to load
        document.addEventListener('DOMContentLoaded', function() {
            // Check if database is loaded
            setTimeout(() => {
                if (typeof citizenDatabase !== 'undefined' && Array.isArray(citizenDatabase)) {
                    updateStats();
                    console.log('✅ Database loaded successfully!');
                    console.log('📊 Sample records:', citizenDatabase.slice(0, 3));
                } else {
                    console.warn('⚠️ Database not loaded. Check main.js');
                    document.getElementById('lastUpdated').textContent = 'Failed to load';
                    showToast('Database failed to load', 'error');
                }
            }, 1000);
        });

        // Global functions
        window.copyResult = copyResult;
        window.showToast = showToast;

        console.log('🔍 KHARAL MODS Citizen Search loaded!');
        console.log('📱 Search CNIC to find citizens');
        console.log('📊 Database will load from main.js (CSV format)');
    </script>
</body>
</html>
