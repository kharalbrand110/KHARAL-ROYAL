<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KHARAL</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0c15;min-height:100vh}
.auth-container{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#0a0c15,#1a1a2e);padding:20px}
.auth-card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);padding:40px;border-radius:24px;width:100%;max-width:420px;border:1px solid rgba(255,255,255,0.1)}
.auth-card h2{text-align:center;margin-bottom:10px;font-size:28px;background:linear-gradient(135deg,#00d4ff,#00a859);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-card .subtitle{text-align:center;color:#8b92a8;font-size:14px;margin-bottom:30px}
.auth-card input{width:100%;padding:14px 16px;margin-bottom:15px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:12px;color:white;font-size:14px}
.auth-card input:focus{outline:none;border-color:#00a859}
.auth-card button{width:100%;padding:14px;background:linear-gradient(135deg,#00a859,#008040);border:none;border-radius:12px;color:white;font-size:16px;font-weight:600;cursor:pointer}
.switch-text{text-align:center;margin-top:20px;font-size:14px;color:#8b92a8}
.switch-text span{color:#00a859;cursor:pointer}
.error-msg{background:rgba(231,76,60,0.2);color:#e74c3c;padding:10px;border-radius:10px;text-align:center;margin-bottom:15px;font-size:13px;display:none}
.app-container{display:none;background:#0a0c15;min-height:100vh;padding-bottom:80px}
.main-header{background:rgba(255,255,255,0.03);backdrop-filter:blur(10px);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.05);position:sticky;top:0;z-index:100}
.logo h2{font-size:20px;font-weight:800;background:linear-gradient(135deg,#00d4ff,#00a859);-webkit-background-clip:text;background-clip:text;color:transparent}
.user-info{display:flex;align-items:center;gap:15px}
.balance-card{background:linear-gradient(135deg,#00a859,#008040);padding:8px 18px;border-radius:30px;text-align:center}
.balance-card .label{font-size:10px;opacity:0.8;color:white}
.balance-card .amount{font-size:16px;font-weight:bold;color:white}
.avatar{width:42px;height:42px;background:linear-gradient(135deg,#00d4ff,#00a859);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;color:white;cursor:pointer}
.store-container{padding:20px}
.search-section{margin-bottom:20px}
.search-box{display:flex;align-items:center;background:rgba(255,255,255,0.05);border-radius:30px;padding:12px 20px}
.search-box i{color:#8b92a8;margin-right:10px}
.search-box input{flex:1;background:transparent;border:none;color:white;font-size:14px;outline:none}
.categories{display:flex;gap:10px;overflow-x:auto;padding:10px 0;margin-bottom:20px}
.category-btn{padding:8px 20px;background:rgba(255,255,255,0.05);border:none;border-radius:30px;color:#8b92a8;font-size:13px;cursor:pointer}
.category-btn.active{background:linear-gradient(135deg,#00a859,#008040);color:white}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
@media(min-width:768px){.products-grid{grid-template-columns:repeat(3,1fr)}}
.product-card{background:rgba(255,255,255,0.05);border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.05);transition:all 0.3s}
.product-card:hover{transform:translateY(-3px);border-color:#00a859}
.product-icon{height:120px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,168,89,0.1),rgba(0,212,255,0.1))}
.product-icon i{font-size:50px;color:#00a859}
.product-info{padding:12px}
.product-name{font-size:13px;font-weight:600;color:white;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-price{font-size:16px;font-weight:800;color:#00a859;margin-bottom:5px}
.product-old-price{font-size:11px;color:#8b92a8;text-decoration:line-through;margin-left:5px}
.product-discount{font-size:11px;color:#ff4757}
.buy-btn{width:100%;padding:8px;background:linear-gradient(135deg,#00a859,#008040);border:none;border-radius:8px;color:white;font-weight:600;font-size:12px;cursor:pointer;margin-top:8px}
.buy-btn.purchased{background:#2ed573}
.deposit-container{padding:20px}
.wallet-balance{background:linear-gradient(135deg,#00a859,#008040);border-radius:20px;padding:30px;text-align:center;margin-bottom:20px}
.wallet-balance .label{font-size:14px;opacity:0.9;color:white}
.wallet-balance .amount{font-size:42px;font-weight:800;color:white}
.deposit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#00a859,#008040);border:none;border-radius:12px;color:white;font-weight:600;cursor:pointer;margin-bottom:20px}
.deposit-info{background:rgba(255,255,255,0.05);border-radius:16px;padding:20px;text-align:center;margin-bottom:20px}
.deposit-info .account-number{font-size:22px;font-weight:bold;color:#00a859;margin:10px 0;cursor:pointer}
.upload-area{border:2px dashed #00a859;border-radius:16px;padding:20px;text-align:center;cursor:pointer;margin-bottom:15px}
.purchases-container{padding:20px}
.purchases-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
@media(min-width:768px){.purchases-grid{grid-template-columns:repeat(3,1fr)}}
.purchase-card{background:rgba(255,255,255,0.05);border-radius:16px;padding:15px;text-align:center}
.purchase-card .product-name{font-size:14px;font-weight:600;color:white;margin-bottom:8px}
.purchase-card .product-price{font-size:16px;font-weight:700;color:#00a859;margin-bottom:8px}
.download-link{display:inline-block;background:#00a859;color:white;padding:8px 16px;border-radius:8px;text-decoration:none;font-size:12px;margin-top:8px}
.profile-container{padding:20px}
.profile-card{background:linear-gradient(135deg,#00d4ff20,#00a85920);border-radius:20px;padding:25px;text-align:center;margin-bottom:20px}
.profile-avatar{width:80px;height:80px;background:linear-gradient(135deg,#00d4ff,#00a859);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;font-size:32px;font-weight:bold;color:white}
.profile-name{font-size:20px;font-weight:700;margin-bottom:5px}
.profile-email{font-size:12px;color:#8b92a8}
.info-card{background:rgba(255,255,255,0.05);border-radius:16px;padding:20px;margin-bottom:20px}
.info-card p{margin:8px 0;color:#cbd5e0;font-size:14px}
.info-card strong{color:#00a859}
.copy-btn{width:100%;padding:12px;background:#00a859;border:none;border-radius:10px;color:white;font-weight:600;cursor:pointer;margin-top:10px}
.logout-btn{width:100%;padding:12px;background:rgba(231,76,60,0.2);border:1px solid #e74c3c;border-radius:10px;color:#e74c3c;font-weight:600;cursor:pointer;margin-top:10px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,12,21,0.95);backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:10px 20px;border-top:1px solid rgba(255,255,255,0.05);z-index:100}
.nav-item{text-align:center;cursor:pointer;padding:6px 12px;border-radius:30px;color:#8b92a8}
.nav-item.active{background:linear-gradient(135deg,#00a859,#008040);color:white}
.nav-item i{font-size:20px;display:block;margin-bottom:3px}
.nav-item span{font-size:10px;font-weight:500}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000;justify-content:center;align-items:center}
.modal-content{background:#1a1a2e;border-radius:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;padding:25px;border:1px solid rgba(0,168,89,0.3)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,0.1)}
.modal-header h3{color:#00a859}
.close-modal{background:none;border:none;color:white;font-size:24px;cursor:pointer}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#00a859;color:white;padding:12px 24px;border-radius:50px;z-index:1000;animation:fadeOut 3s ease forwards;font-size:14px}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0;visibility:hidden}}
</style>
</head>
